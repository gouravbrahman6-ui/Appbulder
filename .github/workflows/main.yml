name: Build CipherChat APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract cipherchat.zip
        run: |
          rm -rf build_src
          mkdir -p build_src
          if [ -f "cipherchat.zip" ]; then
            unzip -q cipherchat.zip -d build_src
          fi
          find build_src -maxdepth 4 -not -path '*/.*' | head -n 60

      - name: Build Debug APK
        run: |
          PROJ_DIR=$(find build_src -maxdepth 4 \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle.kts" -o -name "build.gradle" \) -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then
            PROJ_DIR="."
          fi
          echo "Using project dir: $PROJ_DIR"
          cd "$PROJ_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --info
          else
            gradle assembleDebug --stacktrace --info
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CipherChat-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
