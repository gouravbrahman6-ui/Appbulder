name: Build CipherChat APK from ZIP
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip cipherchat.zip if present
        run: |
          if [ -f "cipherchat.zip" ]; then
            mkdir -p zip_project
            unzip -q cipherchat.zip -d zip_project
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -d "zip_project" ]; then
            WORKDIR=$(find zip_project -maxdepth 4 -name "gradlew" -exec dirname {} \; | head -n 1)
            if [ -n "$WORKDIR" ]; then
              cd "$WORKDIR"
              chmod +x gradlew
              ./gradlew assembleDebug --stacktrace
            else
              gradle assembleDebug --stacktrace
            fi
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CipherChat-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          
